# ==============================================================================
# Nginx Configuration for Game Trend Radar
# Domain: fuheshka.qd.je
# Upstream Server: http://127.0.0.1:4200 (Node.js / PM2)
# Features: Real-time unbuffered SSE streaming, Gzip compression, Security headers
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. HTTP Server Block (Port 80)
# Redirects all plaintext HTTP traffic to HTTPS while preserving ACME challenge
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name fuheshka.qd.je;

    # Allow Let's Encrypt / Certbot ACME HTTP-01 challenge verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all remaining HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server Block (Port 443)
# Production TLS reverse proxy with zero-latency Server-Sent Events (SSE)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fuheshka.qd.je;

    # SSL Certificates (managed by Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/fuheshka.qd.je/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fuheshka.qd.je/privkey.pem;

    # Modern TLS Security Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Gzip Compression for static web assets and JSON API responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/rss+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/svg+xml
        image/x-icon
        text/css
        text/javascript
        text/plain
        text/xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # --------------------------------------------------------------------------
    # Route 1: Real-time Server-Sent Events (SSE) Stream
    # Disables proxy buffering, chunked transfer encoding, and caching
    # --------------------------------------------------------------------------
    location /api/events {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;

        # Disable buffering and caching so events are flushed to clients immediately
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Clear Connection header to maintain persistent HTTP/1.1 keep-alive
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep connection open for long-lived real-time streams (24 hours)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Disable gzip compression on SSE stream to prevent internal buffer delays
        gzip off;
    }

    # --------------------------------------------------------------------------
    # Route 2: Web Dashboard UI & REST API Endpoints
    # Proxies static assets, snapshots, and background market trigger endpoints
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade support for dev mode or future bi-directional sockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard timeouts and request limits
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 10M;
    }
}
