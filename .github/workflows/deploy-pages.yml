name: Deploy Radar Dashboard to GitHub Pages

on:
  push:
    branches:
      - main
  # Снимок рынка больше не коммитится: Pages сам забирает свежий с сервера каждые 6 часов
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & tests
        run: npm run typecheck && npm test

      # Без валидного снимка задеплоились бы демо-данные поверх рабочей версии — поэтому падаем,
      # и на Pages остаётся предыдущий деплой. URL можно переопределить переменной репозитория SNAPSHOT_URL.
      - name: Fetch latest snapshot from server
        env:
          SNAPSHOT_URL: ${{ vars.SNAPSHOT_URL || 'https://radar.fuheshka.qd.je/api/snapshots/latest' }}
        run: |
          mkdir -p web/public/data
          curl -fsS --retry 3 --retry-delay 5 --max-time 60 --compressed "$SNAPSHOT_URL" -o web/public/data/latest_snapshot.json
          node -e "const s=JSON.parse(require('fs').readFileSync('web/public/data/latest_snapshot.json','utf8')); if(!Array.isArray(s.games)||!s.games.length) throw new Error('snapshot has no games'); console.log('snapshot', s.id, s.timestamp, s.games.length, 'games')"

      - name: Build Web Bundle
        run: npm run web:build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
